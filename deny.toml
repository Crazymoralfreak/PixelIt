# Rules of `cargo deny check` for the dependencies of PixelIt, run by
# .github/workflows/ci.yml.

[graph]
# The systems a release is built for. A dependency that exists only on one of
# them is still checked.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# An unmaintained crate deep in the tree is reported by its users; here only
# the crates PixelIt depends on directly count.
unmaintained = "workspace"

[licenses]
version = 2
# Everything else is refused until it is looked at and added here.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "IJG",
  "Unicode-3.0",
  # Weak copyleft per file: changes to those files are published, the rest of
  # the program keeps its own licence.
  "MPL-2.0",
]
exceptions = [
  # The RAW decoder. LGPL lets a program of another licence use the library
  # as long as the user can replace the library, which the open source code
  # of PixelIt provides.
  { crate = "rawler", allow = ["LGPL-2.1"] },
  # bzip2, pulled in by the 7z unpacker. The bzip2 licence allows use and
  # redistribution with the licence text kept.
  { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
]

[bans]
multiple-versions = "allow"
# The crates of the workspace refer to each other by path, without a version.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
