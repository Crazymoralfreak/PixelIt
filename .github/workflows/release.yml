name: Release

# A pushed tag "v<version>" builds the installer and the portable archive,
# signs the installer for the updater and attaches the files and the update
# manifest (latest.json) to the GitHub release of that tag. The same tag
# also builds the macOS disk images, in .github/workflows/platforms.yml.
#
# A version with a suffix, such as v1.1.0-beta.1, becomes a pre-release. The
# stable update address (releases/latest) does not see it. The beta channel
# reads its manifest from the permanent release "beta-channel", which every
# release refreshes, stable ones included.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
# the private half of the key whose public half is in src-tauri/tauri.conf.json.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  desktop:
    uses: ./.github/workflows/platforms.yml
    secrets: inherit

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version in the project files
        run: |
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # The version of every crate comes from [workspace.package] in the root Cargo.toml.
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $expected = $env:GITHUB_REF_NAME -replace '^v', ''
          foreach ($found in @($tauri, $npm, $cargo)) {
            if ($found -ne $expected) {
              throw "Tag $env:GITHUB_REF_NAME does not match the versions: tauri.conf.json $tauri, package.json $npm, Cargo.toml $cargo"
            }
          }
          "VERSION=$expected" >> $env:GITHUB_ENV
          # A version with a suffix is a pre-release.
          if ($expected -match '-') {
            "PRERELEASE=true" >> $env:GITHUB_ENV
          } else {
            "PRERELEASE=false" >> $env:GITHUB_ENV
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # MozJPEG and the AV1 encoder have assembly parts.
      - uses: ilammy/setup-nasm@v1

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install dependencies
        run: npm ci

      - name: Dictionaries and the licence list
        run: |
          npm run i18n:check
          if ($LASTEXITCODE -ne 0) {
            throw "The dictionaries differ"
          }
          npm run licenses:check
          if ($LASTEXITCODE -ne 0) {
            throw "src/licenses.json is out of date"
          }

      # The application embeds the built interface, so its tests need it too.
      - name: Build the interface
        run: npm run build

      - name: Look for golden samples
        id: golden
        run: |
          if (Test-Path crates/pixelit-codecs/tests/golden/*.png) {
            "skip=" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output '::warning title=Golden samples::There are no samples in crates/pixelit-codecs/tests/golden; operations were not compared with samples.'
            "skip=--skip golden_samples_match" >> $env:GITHUB_OUTPUT
          }

      - name: Tests
        run: cargo test --workspace --locked -- ${{ steps.golden.outputs.skip }}

      # Runs the type check and the frontend build first (beforeBuildCommand).
      # tauri.release.conf.json turns the signing of the installer on and adds
      # the worker to the installer; a local build does not use it and
      # therefore needs no key.
      - name: Build and sign the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "The secret TAURI_SIGNING_PRIVATE_KEY is not set: the installer cannot be signed"
          }
          # pixelit-worker is built first: the program that runs the neural
          # models in its own process. The installer copies it next to PixelIt.
          # The release config expects the file under src-tauri/binaries with
          # the target triple in the name.
          cargo build --release --locked -p pixelit-worker
          if ($LASTEXITCODE -ne 0) {
            throw "pixelit-worker was not built"
          }
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item target/release/pixelit-worker.exe src-tauri/binaries/pixelit-worker-x86_64-pc-windows-msvc.exe -Force
          npm run tauri build -- --config "$env:GITHUB_WORKSPACE/src-tauri/tauri.release.conf.json"
          if ($LASTEXITCODE -ne 0) {
            throw "The build failed"
          }

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          # The crates share one target folder at the root of the repository.
          $installerName = "PixelIt_${env:VERSION}_x64-setup.exe"
          $installer = "target/release/bundle/nsis/$installerName"
          $signatureFile = "$installer.sig"
          if (-not (Test-Path $installer)) {
            throw "The installer was not built: $installer"
          }
          if (-not (Test-Path $signatureFile)) {
            throw "The installer was not signed: $signatureFile is missing"
          }

          # The portable copy: the program, the worker beside it and the marker
          # that makes PixelIt keep its data in the "data" folder next to itself.
          $portable = "PixelIt_${env:VERSION}_x64-portable.zip"
          $portableFolder = Join-Path $env:RUNNER_TEMP "PixelIt"
          New-Item -ItemType Directory -Force -Path $portableFolder | Out-Null
          Copy-Item target/release/PixelIt.exe (Join-Path $portableFolder "PixelIt.exe")
          Copy-Item target/release/pixelit-worker.exe (Join-Path $portableFolder "pixelit-worker.exe")
          New-Item -ItemType File -Force -Path (Join-Path $portableFolder "portable") | Out-Null
          Compress-Archive -Path $portableFolder -DestinationPath $portable -Force

          # Windows half of the update manifest. The shared latest.json is
          # written after the macOS files are on the release too.
          $signature = (Get-Content $signatureFile -Raw).Trim()
          $entry = [ordered]@{
            signature = $signature
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$installerName"
          }
          $windowsUpdate = [ordered]@{
            version = $env:VERSION
            notes = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = $entry
              "windows-x86_64-nsis" = $entry
            }
          }
          $windowsUpdateFile = Join-Path (Get-Location) "windows-update.json"
          [System.IO.File]::WriteAllText($windowsUpdateFile, ($windowsUpdate | ConvertTo-Json -Depth 5))

          # The description of the release: the section of this version in CHANGELOG.md.
          $notes = New-Object System.Collections.Generic.List[string]
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^##\s') {
              $inside = $line -match ('^##\s+\[?' + [regex]::Escape($env:VERSION) + '\]?(\s|$)')
              continue
            }
            if ($inside) {
              $notes.Add($line)
            }
          }
          $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
          [System.IO.File]::WriteAllText($notesFile, (($notes -join "`n").Trim() + "`n"))

          $existing = gh release list --limit 1000 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the list of releases"
          }

          # A release made by hand for this tag is kept; only its files are replaced.
          if (@($existing) -notcontains $tag) {
            $arguments = @($tag, "--title", "PixelIt $env:VERSION")
            if ($notes.Count -gt 0) {
              $arguments += @("--notes-file", $notesFile)
            } else {
              $arguments += "--generate-notes"
            }
            if ($env:PRERELEASE -eq "true") {
              $arguments += "--prerelease"
            }
            gh release create @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create the release $tag"
            }
          }
          gh release upload $tag $installer $portable $windowsUpdateFile --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload the files to the release $tag"
          }

      - name: Cache statistics
        if: always()
        run: sccache --show-stats

  # After Windows and macOS have uploaded their files, write the shared
  # latest.json that installed copies of every system read.
  manifest:
    needs: [windows, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Build latest.json for Windows and macOS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          work=$(mktemp -d)
          gh release download "$tag" --pattern 'windows-update.json' --dir "$work"
          gh release download "$tag" --pattern '*.app.tar.gz' --dir "$work" || true
          gh release download "$tag" --pattern '*.app.tar.gz.sig' --dir "$work" || true
          python3 - "$work" "$tag" "$version" "$GITHUB_REPOSITORY" <<'PY'
          import json, pathlib, sys
          work = pathlib.Path(sys.argv[1])
          tag = sys.argv[2]
          version = sys.argv[3]
          repo = sys.argv[4]
          base = json.loads((work / "windows-update.json").read_text(encoding="utf-8"))
          platforms = dict(base.get("platforms") or {})
          for archive in sorted(work.glob("*.app.tar.gz")):
              name = archive.name
              key = None
              for platform in ("darwin-aarch64", "darwin-x86_64"):
                  if platform in name:
                      key = platform
                      break
              if key is None:
                  continue
              sig = pathlib.Path(str(archive) + ".sig")
              if not sig.is_file():
                  print(f"missing signature for {name}", file=sys.stderr)
                  continue
              platforms[key] = {
                  "signature": sig.read_text(encoding="utf-8").strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              }
          manifest = {
              "version": version,
              "notes": base.get("notes") or f"https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": base.get("pub_date"),
              "platforms": platforms,
          }
          out = work / "latest.json"
          out.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY
          gh release upload "$tag" "$work/latest.json" --clobber
          # Beta channel: forward only.
          channel=beta-channel
          if ! gh release view "$channel" >/dev/null 2>&1; then
            gh release create "$channel" --prerelease --target "$GITHUB_SHA" --title "Beta channel" --notes "The update manifest of the beta channel of PixelIt. The files of every version are in its own release."
          fi
          previous=$(mktemp -d)
          gh release download "$channel" --pattern latest.json --dir "$previous" --clobber 2>/dev/null || true
          newer=true
          if [ -f "$previous/latest.json" ]; then
            newer=$(python3 - "$version" "$previous/latest.json" <<'PY'
          import json, sys
          def parts(text):
              out = []
              for piece in text.replace("-", ".").split("."):
                  out.append(int(piece) if piece.isdigit() else piece)
              return out
          current = sys.argv[1]
          previous = json.load(open(sys.argv[2], encoding="utf-8"))["version"]
          print("true" if parts(current) > parts(previous) else "false")
          PY
          )
          fi
          if [ "$newer" = "true" ]; then
            gh release upload "$channel" "$work/latest.json" --clobber
          else
            echo "The beta channel already offers a newer or equal version; its manifest is left as it is."
          fi
