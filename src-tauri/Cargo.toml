[package]
name = "pixelit"
description = "PixelIt - desktop image toolkit for Windows"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
default-run = "pixelit"

[lib]
name = "pixelit_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pixelit-core.workspace = true
pixelit-codecs.workspace = true
pixelit-engine.workspace = true
pixelit-ai.workspace = true
pixelit-tools.workspace = true
pixelit-cli.workspace = true
pixelit-mcp.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-drag = "2"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
rayon.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
